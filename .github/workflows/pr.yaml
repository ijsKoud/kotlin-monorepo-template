name: Pull request

# Checks every pull request:
#   1. the title is a Conventional Commit (PRs are squash-merged, so the title decides the version bump)
#   2. the projects the PR touches (and everything depending on them) build and pass their tests
#   3. a comment previews which versions the PR would release
on: pull_request

permissions:
  contents: read
  pull-requests: write # to post the release preview comment

concurrency:
  group: pr-${{ github.event.number }}
  cancel-in-progress: true # a new push replaces the run that is still going for the same PR

jobs:
  check:
    name: Check pull request
    runs-on: ubuntu-latest
    env:
      RELEASE_TOOL: tools/release/build/install/release/bin/release
      PROJECT_GRAPH: build/project-graph.tsv
      BASE_BRANCH: origin/${{ github.base_ref }}
      PR_NUMBER: ${{ github.event.number }}
      PR_TITLE: ${{ github.event.pull_request.title }}
      GH_TOKEN: ${{ github.token }} # the gh CLI reads its token from here
      GH_REPO: ${{ github.repository }} # and the repository to talk to
    steps:
      - name: Check out the code with its full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the release tool reads tags and history

      - name: Set up Java 25
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 25

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Build the release tool and write the project graph
        run: ./gradlew --quiet projectGraph :tools:release:installDist

      - name: Check that the PR title is a Conventional Commit
        run: $RELEASE_TOOL check-title "$PR_TITLE"

      - name: Build and test the affected projects
        run: |
          # The release tool prints one Gradle task per affected project, e.g. ":apps:hello:build".
          gradle_tasks=$($RELEASE_TOOL affected --graph "$PROJECT_GRAPH" --base "$BASE_BRANCH" | xargs)

          if [ -z "$gradle_tasks" ]; then
            echo "No projects are affected, nothing to build"
            exit 0
          fi

          echo "Building: $gradle_tasks"
          ./gradlew $gradle_tasks

      - name: Comment which versions this PR would release
        run: |
          $RELEASE_TOOL plan --graph "$PROJECT_GRAPH" --format markdown \
            --pr-title "$PR_TITLE" --pr-base "$BASE_BRANCH" > release-preview.md

          # --edit-last updates the comment from the previous push instead of adding a new one.
          gh pr comment "$PR_NUMBER" --body-file release-preview.md --edit-last --create-if-none
